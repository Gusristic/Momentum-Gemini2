name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master', 'yahoo', '*']
  workflow_dispatch:
  schedule:
    # Actualización automática de cotizaciones de lunes a viernes a las 21:00 UTC (tras el cierre de mercado)
    - cron: '0 21 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch latest market quotes from Yahoo Finance
        run: npx tsx scripts/update-market-data.ts

      - name: Build static site with Vite
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

